  image: ""
  summary: >
    PhD in Electrical Engineering from Korea Advanced Institute of Science and Technology (KAIST),
    working under Prof. David Hyunchul Shim at the Unmanned System Research Group (USRG).
    Research focuses on visual and inertial state estimation, visual odometry/SLAM,
    and autonomous drones. Experienced in building real-world autonomous drone systems
    for search-and-rescue, reconnaissance, anti-drone, maritime security, and
    high-speed autonomous drone racing.

