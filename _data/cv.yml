    Competitions:
      - name: A2RL Autonomous Drone Championship (2025–2026)
        url: https://a2rl.io/autonomous-drone-race
        summary: >
          Develop algorithms for high-speed drone racing that rely exclusively on a single monocular
          RGB camera and an IMU sensor for real-time perception, navigation, and control.
          Stacks: Visual-Inertial-based Localization, Gate Detection, Model Predictive Control,
          Optimal Trajectory Planning.
        highlights:
          - Held by ASPIRE – Abu Dhabi Autonomous Racing League, United Arab Emirates
          - Sep 2024 – Present, Abu Dhabi, UAE

      - name: 3rd Mohamed Bin Zayed International Robotics Challenge (MBZIRC)
        url: https://www.mbzirc.com/
        summary: >
          Developed autonomous drones (UAVs) and an unmanned surface vehicle (USV) to perform an
          inspection task (detect illegal vessels) and an intervention task (retrieve stolen objects
          from illegal vessels) in a GPS-denied marine environment, addressing issues like piracy and
          smuggling. Stacks: Localization (AprilTag-based, Optical Flow), Mission Planner, Control,
          Object Detection and Tracking.
        highlights:
          - Held by ASPIRE, United Arab Emirates
          - March 2023 – February 2024, Abu Dhabi, UAE

      - name: ADD Autonomous Drone for Battlefield Environments
        summary: >
          Developed a fully autonomous drone system for reconnaissance in a battlefield indoor environment,
          performing autonomous localization, obstacle avoidance, and exploration along with target
          detection using onboard computation. Stacks: Autonomous Exploration Algorithm, Object
          Detection-Localization (Euclidean Clustering), LiDAR SLAM.
        highlights:
          - Held by Republic of Korea Agency for Defense Development (ADD)
          - October 2022, Daejeon, South Korea

      - name: 5th Army Tiger DroneBot Mission Challenge – Indoor Reconnaissance Drone
        summary: >
          Developed a fully autonomous drone system that entered a building via a second-floor window,
          located hidden objects in real time, and returned to its starting point. Stacks: Autonomous
          Exploration Algorithm, Object Detection, Synthetic Dataset Generation, LiDAR SLAM.
        highlights:
          - Held by Republic of Korea Army Training and Doctrine Command (ROKA TRADOC)
          - Aug 2022, Daejeon, South Korea

    Projects:
